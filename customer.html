<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLMCSS Cafe - Self Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

  <header class="text-center py-4 border-b border-slate-800">
    <div class="inline-flex items-center space-x-2 bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full text-xs font-bold mb-2">
      <i class="fa-solid fa-mug-hot"></i>
      <span>BLMCSS CAFE</span>
    </div>
    <h1 class="text-2xl font-black text-white">Self-Order Beverages</h1>
    <p class="text-xs text-slate-400 mt-1">Select your drink and show the QR code at the counter to pay</p>
  </header>

  <main id="orderView" class="flex-1 my-4 space-y-4 overflow-y-auto">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Your Name</label>
      <input type="text" id="custName" placeholder="Enter your name..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
    </div>

    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Choose Drink</label>
      <div class="grid grid-cols-2 gap-2.5" id="customerMenuList">
        <p class="text-slate-500 text-xs col-span-2 text-center py-6">Loading menu...</p>
      </div>
    </div>

    <div id="itemOptions" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hidden space-y-3">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <span id="selectedItemName" class="font-bold text-amber-400">Drink Name</span>
        <span id="selectedItemPrice" class="font-bold">$0.00</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Temperature</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setTemp('Cold')" id="btnCold" class="py-2 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300">Cold 🧊</button>
          <button type="button" onclick="setTemp('Hot')" id="btnHot" class="py-2 rounded-xl text-xs font-bold border border-slate-700 text-slate-400">Hot ☕</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Notes / Customization</label>
        <input type="text" id="custNotes" placeholder="e.g. Less sugar, oat milk..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
      </div>
    </div>
  </main>

  <footer id="orderFooter" class="pt-2">
    <button onclick="submitSelfOrder()" id="btnSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-4 rounded-2xl text-base shadow-lg transition">
      Submit & Show Payment QR
    </button>
  </footer>

  <div id="qrTicketView" class="hidden flex-1 flex flex-col justify-center items-center text-center p-6 bg-slate-800/80 backdrop-blur-md rounded-3xl border border-slate-700 my-auto space-y-4">
    <div class="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs font-bold">
      <i class="fa-solid fa-clock mr-1"></i> STATUS: UNPAID
    </div>

    <h2 class="text-3xl font-black text-white" id="ticketOrderNum">#101</h2>
    <p class="text-xs text-slate-300">Show this QR code to the cashier to pay</p>

    <div class="bg-white p-4 rounded-2xl shadow-xl my-2" id="qrcode"></div>

    <div class="text-xs text-slate-400 bg-slate-900 p-3 rounded-xl w-full text-left space-y-1">
      <p><strong class="text-slate-200">Drink:</strong> <span id="ticketDrink">-</span></p>
      <p><strong class="text-slate-200">Amount Due:</strong> <span id="ticketPrice" class="text-amber-400 font-bold">$0.00</span></p>
    </div>

    <button onclick="resetCustomerForm()" class="text-xs text-slate-400 underline hover:text-slate-200 pt-2">
      Order Another Drink
    </button>
  </div>

  <script>
    // ⚠️ REPLACE WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqZ-8p40iS6uM8hC9g0m8g9V_example/exec";

    let state = { menu: [], selectedItem: null, selectedTemp: "Cold", nextOrderNum: 101 };

    function init() {
      fetch(`${APPS_SCRIPT_URL}?action=getInitialData&_t=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          if (data.menu) state.menu = data.menu.filter(i => i.available);
          if (data.nextOrderNum) state.nextOrderNum = data.nextOrderNum;
          renderMenu();
        });
    }

    function renderMenu() {
      const container = document.getElementById('customerMenuList');
      container.innerHTML = "";
      state.menu.forEach(item => {
        const btn = document.createElement('button');
        btn.className = `p-3 rounded-xl border text-left transition ${state.selectedItem?.name === item.name ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-800/50'}`;
        btn.onclick = () => selectItem(item);
        btn.innerHTML = `<p class="font-bold text-xs text-white">${item.name}</p><p class="text-amber-400 font-extrabold text-xs mt-1">$${item.price.toFixed(2)}</p>`;
        container.appendChild(btn);
      });
    }

    function selectItem(item) {
      state.selectedItem = item;
      state.selectedTemp = item.tempOptions.includes("Cold") ? "Cold" : "Hot";
      document.getElementById('itemOptions').classList.remove('hidden');
      document.getElementById('selectedItemName').innerText = item.name;
      document.getElementById('selectedItemPrice').innerText = `$${item.price.toFixed(2)}`;
      renderMenu();
    }

    function setTemp(temp) {
      state.selectedTemp = temp;
      document.getElementById('btnCold').className = temp === 'Cold' ? 'py-2 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300' : 'py-2 rounded-xl text-xs font-bold border border-slate-700 text-slate-400';
      document.getElementById('btnHot').className = temp === 'Hot' ? 'py-2 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300' : 'py-2 rounded-xl text-xs font-bold border border-slate-700 text-slate-400';
    }

    function submitSelfOrder() {
      const name = document.getElementById('custName').value.trim();
      if (!name) return alert("Please enter your name!");
      if (!state.selectedItem) return alert("Please select a drink!");

      const orderData = {
        orderNum: String(state.nextOrderNum),
        orderTime: new Date().toISOString(),
        cashier: "Self-Order QR",
        guestName: name,
        productName: state.selectedItem.name,
        temp: state.selectedTemp,
        customization: document.getElementById('custNotes').value,
        price: state.selectedItem.price,
        status: "UNPAID"
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "createUnpaidOrder", order: orderData })
      });

      showQRTicket(orderData);
    }

    function showQRTicket(order) {
      document.getElementById('orderView').classList.add('hidden');
      document.getElementById('orderFooter').classList.add('hidden');
      document.getElementById('qrTicketView').classList.remove('hidden');

      document.getElementById('ticketOrderNum').innerText = `#${order.orderNum}`;
      document.getElementById('ticketDrink').innerText = `${order.productName} (${order.temp})`;
      document.getElementById('ticketPrice').innerText = `$${order.price.toFixed(2)}`;

      document.getElementById('qrcode').innerHTML = "";
      new QRCode(document.getElementById("qrcode"), { text: order.orderNum, width: 160, height: 160 });
    }

    function resetCustomerForm() {
      document.getElementById('qrTicketView').classList.add('hidden');
      document.getElementById('orderView').classList.remove('hidden');
      document.getElementById('orderFooter').classList.remove('hidden');
      state.selectedItem = null;
      document.getElementById('itemOptions').classList.add('hidden');
      init();
    }

    init();
  </script>
</body>
</html>
