<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLMCSS Cafe - Customer & Teacher Self-Order</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

  <!-- Header -->
  <header class="text-center py-4 border-b border-slate-200 bg-white rounded-3xl p-4 shadow-sm mb-4">
    <div class="inline-flex items-center space-x-2 bg-amber-500/10 text-amber-700 px-3.5 py-1 rounded-full text-xs font-extrabold mb-2 border border-amber-300/60">
      <i class="fa-solid fa-mug-hot text-amber-500"></i>
      <span>MFCafe Pre-Order Portal</span>
    </div>
    <h1 class="text-2xl font-black text-slate-800">Self & Teacher Pre-Order</h1>
    <p class="text-xs text-slate-500 mt-1 font-medium">Select your drink, choose pickup time, and get your QR ticket</p>
  </header>

  <!-- Form & Menu View -->
  <main id="orderView" class="flex-1 space-y-4 overflow-y-auto">
    <!-- Guest Info & Pickup Time -->
    <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1">Your Name</label>
        <input type="text" id="custName" placeholder="e.g. Mr. Wong / Spaghetti" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:border-amber-500 transition">
      </div>
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1">Pickup Time (Pre-order / Teacher)</label>
        <input type="text" id="custPickupTime" placeholder="e.g. 10:30 AM / Recess" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:border-amber-500 transition">
      </div>
    </div>

    <!-- Drink Selection Grid -->
    <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-400">Choose Drink</label>
        <span id="mobileAvailableCount" class="text-[11px] font-bold text-slate-400">0 available</span>
      </div>
      <div class="grid grid-cols-2 gap-2.5" id="customerMenuList">
        <p class="text-slate-400 text-xs col-span-2 text-center py-6 font-medium">Loading menu...</p>
      </div>
    </div>

    <!-- Drink Customization Configurator -->
    <div id="itemOptions" class="bg-amber-500/5 p-4 rounded-3xl border border-amber-200/80 hidden space-y-3.5 shadow-sm">
      <div class="flex justify-between items-center border-b border-amber-200/60 pb-2">
        <span id="selectedItemName" class="font-black text-slate-800 text-sm">Drink Name</span>
        <span id="selectedItemPrice" class="font-black text-amber-600 text-sm">$0.00</span>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Temperature Option</label>
        <div class="flex space-x-2" id="custTempBtnContainer"></div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Customization / Notes</label>
        <div class="flex flex-wrap gap-1.5 mb-2" id="custRemarkPillsContainer"></div>
        <input type="text" id="custNotes" placeholder="e.g. Less sugar, extra hot..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
      </div>
    </div>
  </main>

  <footer id="orderFooter" class="pt-3">
    <button onclick="submitSelfOrder()" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 rounded-2xl text-base shadow-md transition flex items-center justify-center space-x-2">
      <i class="fa-solid fa-qrcode"></i>
      <span id="submitBtnText">Submit Pre-Order & Get QR Code</span>
    </button>
  </footer>

  <!-- QR CODE TICKET VIEW -->
  <div id="qrTicketView" class="hidden flex-1 flex flex-col justify-center items-center text-center p-6 bg-white rounded-3xl border border-slate-200 my-auto space-y-4 shadow-sm">
    <div class="bg-purple-100 text-purple-800 px-3.5 py-1 rounded-full text-xs font-extrabold border border-purple-300">
      <i class="fa-solid fa-clock mr-1"></i> STATUS: RESERVED
    </div>

    <h2 class="text-4xl font-black text-amber-600" id="ticketOrderNum">#Auto</h2>
    <p class="text-xs text-slate-500 font-medium">Show this QR code to bar staff or cashier upon pickup</p>

    <div class="bg-white p-4 rounded-2xl shadow-md my-2 border-4 border-amber-400" id="qrcode"></div>

    <div class="text-xs text-slate-600 bg-slate-50 p-4 rounded-2xl w-full text-left space-y-1.5 border border-slate-200">
      <p><strong class="text-slate-400">Guest:</strong> <span id="ticketGuest" class="text-slate-800 font-bold">-</span></p>
      <p><strong class="text-slate-400">Pickup Time:</strong> <span id="ticketPickup" class="text-purple-700 font-black">-</span></p>
      <p><strong class="text-slate-400">Drink:</strong> <span id="ticketDrink" class="text-slate-800 font-bold">-</span></p>
      <p><strong class="text-slate-400">Total Price:</strong> <span id="ticketPrice" class="text-amber-600 font-black text-sm">$0.00</span></p>
    </div>

    <button onclick="resetCustomerForm()" class="text-xs font-bold text-slate-400 hover:text-slate-600 underline pt-2">
      Order Another Drink
    </button>
  </div>

  <script>
    // ⚠️ REPLACE WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYkFblv7uXYc1VaZeWFeByGqCTYOMvOgr1blc_zpbLuMBTSpxv1QeKP2RtbxVKZa2rlw/exec";

    let state = {
      menu: [],
      selectedItem: null,
      selectedTemp: "Cold",
      remarkHotkeys: "+ Less Ice, + No Sugar, + Oat Milk, + Extra Hot"
    };

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function init() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;

      fetch(`${APPS_SCRIPT_URL}?action=getInitialData&_t=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          if (data.menu) state.menu = data.menu.filter(i => i.status?.toLowerCase() === "active");
          if (data.remarkHotkeys) state.remarkHotkeys = data.remarkHotkeys;
          renderMenu();
        });
    }

    function renderMenu() {
      const container = document.getElementById('customerMenuList');
      if (!container) return;
      container.innerHTML = "";

      const badge = document.getElementById('mobileAvailableCount');
      if (badge) badge.innerText = `${state.menu.length} available`;

      state.menu.forEach(item => {
        const isSelected = state.selectedItem?.name === item.name;
        const btn = document.createElement('button');
        btn.className = `p-3 rounded-2xl border text-left transition shadow-sm ${isSelected ? 'border-amber-500 bg-amber-500/10 ring-2 ring-amber-400' : 'border-slate-200 bg-white hover:border-slate-300'}`;
        btn.onclick = () => selectItem(item);
        btn.innerHTML = `
          <p class="font-extrabold text-xs text-slate-800">${escapeHtml(item.name)}</p>
          <p class="text-[10px] font-semibold text-slate-400 mt-0.5">${escapeHtml(item.tempOptions)}</p>
          <p class="text-amber-600 font-black text-xs mt-1.5">$${item.price.toFixed(2)}</p>
        `;
        container.appendChild(btn);
      });
    }

    function selectItem(item) {
      state.selectedItem = item;
      document.getElementById('itemOptions')?.classList.remove('hidden');
      
      document.getElementById('selectedItemName').innerText = item.name;
      document.getElementById('selectedItemPrice').innerText = `$${item.price.toFixed(2)}`;
      document.getElementById('submitBtnText').innerText = `Submit Pre-Order ($${item.price.toFixed(2)}) & Get QR`;

      const tempContainer = document.getElementById('custTempBtnContainer');
      tempContainer.innerHTML = "";

      const opts = item.tempOptions || "Hot & Cold";
      if (opts.includes("Cold") && opts.includes("Hot")) {
        state.selectedTemp = "Cold";
        tempContainer.innerHTML = `
          <button type="button" onclick="setTemp('Cold')" id="btnCold" class="flex-1 py-2.5 rounded-xl text-xs font-bold border border-amber-400 bg-amber-100 text-amber-900 shadow-sm">Cold 🧊</button>
          <button type="button" onclick="setTemp('Hot')" id="btnHot" class="flex-1 py-2.5 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-500">Hot ☕</button>
        `;
      } else if (opts.includes("Hot")) {
        state.selectedTemp = "Hot";
        tempContainer.innerHTML = `
          <button type="button" id="btnHot" class="w-full py-2.5 rounded-xl text-xs font-bold border border-amber-400 bg-amber-100 text-amber-900 shadow-sm">Hot Only ☕</button>
        `;
      } else {
        state.selectedTemp = "Cold";
        tempContainer.innerHTML = `
          <button type="button" id="btnCold" class="w-full py-2.5 rounded-xl text-xs font-bold border border-amber-400 bg-amber-100 text-amber-900 shadow-sm">Cold Only 🧊</button>
        `;
      }

      const pillsContainer = document.getElementById('custRemarkPillsContainer');
      pillsContainer.innerHTML = "";
      const hotkeys = state.remarkHotkeys.split(',').map(s => s.trim()).filter(Boolean);
      hotkeys.forEach(hk => {
        pillsContainer.innerHTML += `
          <button type="button" onclick="addNotePill('${escapeHtml(hk)}')" class="bg-white border border-slate-200 text-slate-600 text-[10px] font-bold px-2 py-1 rounded-lg hover:border-amber-400 transition">${escapeHtml(hk)}</button>
        `;
      });

      renderMenu();
    }

    function setTemp(temp) {
      state.selectedTemp = temp;
      const btnCold = document.getElementById('btnCold');
      const btnHot = document.getElementById('btnHot');
      if (btnCold) btnCold.className = temp === 'Cold' ? 'flex-1 py-2.5 rounded-xl text-xs font-bold border border-amber-400 bg-amber-100 text-amber-900 shadow-sm' : 'flex-1 py-2.5 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-500';
      if (btnHot) btnHot.className = temp === 'Hot' ? 'flex-1 py-2.5 rounded-xl text-xs font-bold border border-amber-400 bg-amber-100 text-amber-900 shadow-sm' : 'flex-1 py-2.5 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-500';
    }

    function addNotePill(text) {
      const field = document.getElementById('custNotes');
      if (field) field.value = field.value ? `${field.value}, ${text}` : text;
    }

    function submitSelfOrder() {
      const nameInput = document.getElementById('custName');
      const pickupInput = document.getElementById('custPickupTime');

      const name = nameInput ? nameInput.value.trim() : "";
      const pickupTime = pickupInput ? pickupInput.value.trim() : "Scheduled";

      if (!name) return alert("Please enter your name!");
      if (!state.selectedItem) return alert("Please select a drink!");

      const btnSubmit = document.getElementById('btnSubmit');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.classList.add('opacity-50');
      }

      const notesInput = document.getElementById('custNotes');
      const notes = notesInput ? notesInput.value : "";

      const orderPayload = {
        orderTime: new Date().toISOString(),
        pickupTime: pickupTime,
        cashier: "Teacher / Pre-Order",
        guestName: name,
        productName: state.selectedItem.name,
        temp: state.selectedTemp,
        customization: notes,
        price: state.selectedItem.price,
        status: "RESERVED"
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "createReservedOrder", order: orderPayload })
      })
      .then(res => res.json())
      .then(res => {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('opacity-50');
        }
        if (res.success && res.order) {
          showQRTicket(res.order);
        } else {
          alert("Order creation failed.");
        }
      })
      .catch(err => {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('opacity-50');
        }
        alert("Network error.");
      });
    }

    function showQRTicket(order) {
      document.getElementById('orderView')?.classList.add('hidden');
      document.getElementById('orderFooter')?.classList.add('hidden');
      document.getElementById('qrTicketView')?.classList.remove('hidden');

      document.getElementById('ticketOrderNum').innerText = `#${order.orderNum}`;
      document.getElementById('ticketGuest').innerText = order.guestName;
      document.getElementById('ticketPickup').innerText = order.pickupTime || "Scheduled";
      document.getElementById('ticketDrink').innerText = `${order.productName} (${order.temp})`;
      document.getElementById('ticketPrice').innerText = `$${(order.price || 0).toFixed(2)}`;

      const qrcodeContainer = document.getElementById('qrcode');
      if (qrcodeContainer) {
        qrcodeContainer.innerHTML = "";
        new QRCode(qrcodeContainer, { text: String(order.orderNum), width: 160, height: 160 });
      }
    }

    function resetCustomerForm() {
      document.getElementById('qrTicketView')?.classList.add('hidden');
      document.getElementById('orderView')?.classList.remove('hidden');
      document.getElementById('orderFooter')?.classList.remove('hidden');
      state.selectedItem = null;
      document.getElementById('itemOptions')?.classList.add('hidden');
      document.getElementById('submitBtnText').innerText = "Submit Pre-Order & Get QR Code";
      init();
    }

    init();
  </script>
</body>
</html>
