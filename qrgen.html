<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFCafe - QR Tile Generator</title>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }

    /* ===== THEME PALETTES (QR itself always stays black) ===== */
    body[data-style="coffee"] {
      --ink: #2b1a12;
      --line: #b5651d;
      --cream: #f7efe4;
      --accent: #b5651d;
      --soft: #e8d3b6;
      --watermark: #3b2314;
    }
    body[data-style="espresso"] {
      --ink: #3a2416;
      --line: #3a2416;
      --cream: #f1e7db;
      --accent: #3a2416;
      --soft: #cdb59c;
      --watermark: #3a2416;
    }
    body[data-style="mono"] {
      --ink: #000000;
      --line: #000000;
      --cream: #ffffff;
      --accent: #000000;
      --soft: #d4d4d4;
      --watermark: #000000;
    }

    /* ===== A4 SHEET ===== */
    .page-label {
      width: 210mm;
      margin: 0 auto 2mm;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .sheet {
      width: 190mm;
      height: 277mm;
      padding: 1.5mm;
      box-sizing: border-box;
      background: #ffffff;
      margin: 0 auto 10mm;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
    }
    .sheet-grid {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(2, 91.5mm);
      grid-auto-rows: 135mm;
      gap: 4mm;
      justify-content: center;
      align-content: center;
    }

    /* ===== TILE ===== */
    .tile {
      width: 91.5mm;
      height: 135mm;
      box-sizing: border-box;
      background: #ffffff;
      color: var(--ink);
      border: 0.45mm dashed var(--line);
      border-radius: 3mm;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      break-inside: avoid;
    }

    .tile-head {
      padding: 3mm 4mm 2.4mm;
      text-align: center;
      background: var(--cream);
      border-bottom: 0.4mm dashed var(--line);
      position: relative;
    }
    .brand-logo {
      width: 24mm;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .head-sub {
      margin-top: 0.8mm;
      font-size: 2.1mm;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .tile-body {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2mm 4mm 0;
      overflow: hidden;
    }
    .watermark {
      position: absolute;
      width: 54mm;
      height: 54mm;
      top: 1mm;
      left: 50%;
      transform: translateX(-50%);
      color: var(--watermark);
      opacity: 0.055;
      pointer-events: none;
    }

    .qr-label {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.3mm;
      font-size: 2mm;
      font-weight: 900;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .bean { width: 2.9mm; height: 2.9mm; color: var(--accent); }

    .tile-num {
      position: relative;
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: -0.03em;
      margin: 0.6mm 0 1.4mm;
      color: var(--ink);
    }

    .qr-frame {
      position: relative;
      background: #ffffff;
      padding: 6.5mm;
      border: 0.5mm solid var(--line);
      border-radius: 2.5mm;
    }
    .qr-wrap {
      position: relative;
      width: 36mm;
      height: 36mm;
      background: #ffffff;
    }
    .qr-box { width: 100%; height: 100%; }
    .qr-box canvas, .qr-box img {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .qr-logo-badge {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 8mm;
      height: 8mm;
      background: #ffffff;
      border-radius: 1.5mm;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5mm;
      box-shadow: 0 0 0 0.7mm #ffffff;
    }
    .qr-logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .qr-caption {
      position: relative;
      margin-top: 1.4mm;
      font-size: 1.9mm;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0.72;
    }

    .tile-foot {
      margin-top: auto;
      padding: 2.2mm 4mm 3mm;
      text-align: center;
      background: var(--cream);
      border-top: 0.4mm dashed var(--line);
      position: relative;
    }
    .foot-icon {
      width: 4.6mm;
      height: 4.6mm;
      margin: 0 auto 0.7mm;
      color: var(--accent);
    }
    .foot-msg {
      font-size: 2.6mm;
      font-weight: 800;
      line-height: 1.35;
      color: var(--ink);
    }
    .foot-brand {
      margin-top: 0.9mm;
      font-size: 1.75mm;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ===== PRINT ===== */
    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { margin: 0 !important; padding: 0 !important; }
      body { background: #ffffff !important; }
      .no-print { display: none !important; }
      #preview { padding: 0 !important; }
      .sheet {
        margin: 0 !important;
        box-shadow: none !important;
        break-after: page;
        page-break-after: always;
      }
      .sheet:last-of-type {
        break-after: auto;
        page-break-after: auto;
      }
      .tile { break-inside: avoid; }
    }
  </style>
</head>
<body data-style="coffee" class="min-h-screen">

  <!-- CONTROL PANEL -->
  <div class="no-print max-w-5xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 md:p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center gap-4">
          <img id="panelLogo" alt="M Cafe" class="w-16 h-auto shrink-0">
          <div>
            <h1 class="text-xl md:text-2xl font-black text-slate-900 leading-tight">QR Tile Generator</h1>
            <p class="text-xs md:text-sm text-slate-500 font-medium mt-0.5">Print-ready table tiles · 4 per A4 page · QR encodes the tile number</p>
          </div>
        </div>
        <div class="flex items-center gap-2 text-[11px] font-bold text-slate-400">
          <i class="fa-solid fa-print"></i>
          <span>A4 portrait · 2 × 2 layout</span>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div class="md:col-span-2">
          <label for="tileInput" class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Tile Number(s)</label>
          <input id="tileInput" type="text" value="1-4" autocomplete="off"
            placeholder="e.g. 12 · 1-30 · 1,3,5,8-12"
            class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-bold text-slate-800 focus:outline-none focus:border-amber-500 transition">
          <p class="text-[11px] text-slate-400 font-medium mt-1.5">Single code, comma list, or numeric range. Max 60 tiles per batch.</p>
        </div>
        <div>
          <label for="styleSelect" class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Colour Style</label>
          <select id="styleSelect"
            class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-bold text-slate-800 focus:outline-none focus:border-amber-500 transition">
            <option value="coffee">Coffee Colour (multi-colour)</option>
            <option value="espresso">Espresso (single tone)</option>
            <option value="mono">Black &amp; White (mono)</option>
          </select>
          <p class="text-[11px] text-slate-400 font-medium mt-1.5">QR stays black in every style for scan reliability.</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3 mt-5">
        <button onclick="generate()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-5 py-3 rounded-2xl text-sm shadow-sm transition flex items-center gap-2">
          <i class="fa-solid fa-qrcode"></i> Generate Preview
        </button>
        <button onclick="printTiles()" class="bg-slate-900 hover:bg-slate-800 text-white font-extrabold px-5 py-3 rounded-2xl text-sm shadow-sm transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i> Print A4
        </button>
        <button onclick="clearPreview()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold px-5 py-3 rounded-2xl text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-eraser"></i> Clear
        </button>
        <span id="summary" class="text-xs font-bold text-slate-400 ml-auto"></span>
      </div>

      <p id="errorMsg" class="hidden mt-3 text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2"></p>
    </div>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="pb-12 px-2"></div>

    document.getElementById('panelLogo').src = LOGO_SRC;

    const CUP_SVG = `
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 23h30v14a12 12 0 0 1-12 12h-6a12 12 0 0 1-12-12V23Z"/>
        <path d="M44 27h5a8 8 0 0 1 0 16h-6"/>
        <path d="M22 8c0 4 4 4 4 8s-4 4-4 8"/>
        <path d="M33 6c0 4 4 4 4 8s-4 4-4 8"/>
        <path d="M8 58h48"/>
      </svg>`;

    const BEAN_SVG = `
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="8.5" ry="12.5" transform="rotate(35 16 16)" stroke="currentColor" stroke-width="2"/>
        <path d="M10.5 24.5c4.2-4.2 6.2-7.6 10.8-16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>`;

    const MAX_TILES = 60;

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseTileCodes(raw) {
      const parts = String(raw || "").split(",").map(s => s.trim()).filter(Boolean);
      const out = [];
      const push = code => {
        const c = String(code).trim();
        if (c && !out.includes(c) && out.length < MAX_TILES) out.push(c);
      };

      parts.forEach(part => {
        const range = part.match(/^(\d+)\s*-\s*(\d+)$/);
        if (range) {
          let a = parseInt(range[1], 10);
          let b = parseInt(range[2], 10);
          if (a > b) { const t = a; a = b; b = t; }
          for (let i = a; i <= b; i++) push(String(i));
        } else {
          push(part);
        }
      });

      return out;
    }

    function numSizeMm(code) {
      const len = String(code).length;
      if (len <= 2) return 25;
      if (len === 3) return 20;
      if (len === 4) return 16;
      return 13;
    }

    function tileHtml(code, style) {
      const safe = escapeHtml(code);
      const size = numSizeMm(code);
      const logoPad = style === "mono" ? "0.5mm" : "0.5mm";

      return `
        <div class="tile">
          <div class="tile-head">
            <img class="brand-logo" src="${LOGO_SRC}" alt="M Cafe">
            <div class="head-sub">2/F Chill Zone</div>
          </div>
          <div class="tile-body">
            <div class="watermark">${CUP_SVG}</div>
            <div class="qr-label">
              <span class="bean">${BEAN_SVG}</span>
              <span>QR Tile</span>
              <span class="bean">${BEAN_SVG}</span>
            </div>
            <div class="tile-num" style="font-size:${size}mm;">${safe}</div>
            <div class="qr-frame">
              <div class="qr-wrap">
                <div class="qr-box" data-code="${safe}"></div>
                <span class="qr-logo-badge" style="padding:${logoPad};">
                  <img src="${LOGO_SRC}" alt="M Cafe">
                </span>
              </div>
            </div>
            <div class="qr-caption">Scan to check order status</div>
          </div>
          <div class="tile-foot">
            <div class="foot-icon">${CUP_SVG}</div>
            <p class="foot-msg">Please return to our staff<br>after claiming your beverage.</p>
            <p class="foot-brand">MFCafe · 2/F Chill Zone</p>
          </div>
        </div>`;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      if (!el) return;
      if (!msg) { el.classList.add('hidden'); el.innerText = ""; return; }
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    function generate() {
      showError("");
      const input = document.getElementById('tileInput');
      const codes = parseTileCodes(input ? input.value : "");

      if (codes.length === 0) {
        showError("Please enter at least one tile number, e.g. 12 or 1-30.");
        return;
      }

      const style = document.getElementById('styleSelect').value;
      document.body.dataset.style = style;

      const preview = document.getElementById('preview');
      const pages = [];
      for (let i = 0; i < codes.length; i += 4) pages.push(codes.slice(i, i + 4));

      preview.innerHTML = pages.map((group, idx) => `
        <div class="page-label no-print">A4 Page ${idx + 1} of ${pages.length} · ${group.length} tile${group.length > 1 ? 's' : ''}</div>
        <section class="sheet">
          <div class="sheet-grid">
            ${group.map(code => tileHtml(code, style)).join('')}
          </div>
        </section>
      `).join('');

      renderQrCodes();

      const summary = document.getElementById('summary');
      if (summary) summary.innerText = `${codes.length} tile${codes.length > 1 ? 's' : ''} · ${pages.length} A4 page${pages.length > 1 ? 's' : ''}`;
    }

    function renderQrCodes() {
      const boxes = document.querySelectorAll('.qr-box');
      if (typeof QRCode === "undefined") {
        boxes.forEach(box => {
          box.innerHTML = '<p style="font-size:10px;color:#b91c1c;text-align:center;padding:8px;">QR library failed to load. Check the internet connection.</p>';
        });
        return;
      }

      boxes.forEach(box => {
        const code = box.getAttribute('data-code') || "";
        box.innerHTML = "";
        new QRCode(box, {
          text: code,
          width: 520,
          height: 520,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    function printTiles() {
      if (!document.querySelector('.tile')) {
        showError("Generate at least one tile before printing.");
        return;
      }
      window.print();
    }

    function clearPreview() {
      document.getElementById('preview').innerHTML = "";
      document.getElementById('summary').innerText = "";
      showError("");
    }

    document.getElementById('styleSelect').addEventListener('change', function () {
      document.body.dataset.style = this.value;
    });

    document.getElementById('tileInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        generate();
      }
    });

    generate();
  </script>
